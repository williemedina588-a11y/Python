<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashil - Crear cuenta</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                D<span>ASHIL</span>
            </div>

            <h1>Crear cuenta</h1>

            <p class="subtitle">
                Crea tu cuenta para comenzar a usar Dashil
            </p>


            <form id="registerForm">

                <div class="input-group">

                    <label for="name">
                        Nombre
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="name"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Ingresa tu correo"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Crea una contraseña"
                            required
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirmar contraseña
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">🔐</span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Repite tu contraseña"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Crear cuenta
                </button>

            </form>


            <div class="divider">
                <span>o</span>
            </div>


            <p class="register-text">

                ¿Ya tienes una cuenta?

                <a href="login.html" class="register-link">
                    Iniciar sesión
                </a>

            </p>

        </section>

    </main>


    <script src="registro.js"></script>

</body>

</html>
